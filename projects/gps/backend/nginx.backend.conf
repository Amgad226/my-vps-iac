events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_for $client_forwarded_for {
    default $http_x_forwarded_for;
    '' $remote_addr;
  }

  map $http_x_real_ip $client_real_ip {
    default $http_x_real_ip;
    '' $remote_addr;
  }

  map $http_x_forwarded_proto $client_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  upstream api_backend {
    server api:3000;
  }

  upstream realtime_backend {
    server realtime:3001;
  }

  upstream messaging_backend {
    server messaging-gateway:3002;
  }

  server {
    listen 3000;
    client_max_body_size 20m;

    location /socket.io/ {
      proxy_pass http://realtime_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_real_ip;
      proxy_set_header X-Forwarded-For $client_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_forwarded_proto;
      proxy_read_timeout 75s;
    }

    location ^~ /webhook/telegram {
      proxy_pass http://messaging_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_real_ip;
      proxy_set_header X-Forwarded-For $client_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_forwarded_proto;
    }

    location / {
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_real_ip;
      proxy_set_header X-Forwarded-For $client_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_forwarded_proto;
    }
  }
}
