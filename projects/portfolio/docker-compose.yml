services:
  laravel:
    image: ghcr.io/amgad226/laravel-portfolio:latest
    container_name: laravel_app
    restart: always
    expose:
      - "9000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      LOG_STACK: stderr

    volumes:
      - ./database.sqlite:/var/www/html/database/database.sqlite
      - laravel_public:/var/www/html/public
      - laravel-storage:/var/www/html/storage/app



  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - laravel-storage:/var/www/html/storage/app
      - laravel_public:/var/www/html/public

    depends_on:
      - laravel

volumes:
  laravel_public:
  laravel-storage:
